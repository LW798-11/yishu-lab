},lines:["初九：磐桓，利居贞，利建侯。","六二：屯如邅如，乘马班如。匪寇婚媾，女子贞不字，十年乃字。","六三：即鹿无虞，惟入于林中，君子几不如舍，往吝。","六四：乘马班如，求婚媾，往吉，无不利。","九五：屯其膏，小贞吉，大贞凶。","上六：乘马班如，泣血涟如。"],lineImage:[{zh:"初创时徘徊难行，宜安居守正，广结善缘（利建侯）。",en:"Hesitate and hold; secure your base and ally early."},{zh:"进退两难，乘马盘旋——那不是强盗，是求婚者；守正待时，十年乃成。",en:"Caught in a stall; the horsemen are suitors, not robbers — wait it out, ten years till it resolves."},{zh:"追鹿而没有向导，只会迷失林中——不如舍弃，硬往必有憾。",en:"Hunting deer without a guide leads into deep woods — better to let go."},{zh:"骑马盘旋之后终于去求婚，前往吉祥，无往不利。",en:"After circling, go and propose — movement now brings success."},{zh:"恩泽积在上面未下施；小事守正则吉，干大事则凶。",en:"Hoarding the balm; small affairs OK, big ones fail."},{zh:"骑马盘旋，泣血涟涟——困顿到极处，妄动愈困。",en:"Weeping blood, trapped at the end; movement only deepens the trap."}]},山水蒙:{image:{zh:"山下出泉——蒙昧待启，如泉水初发，需要引导疏通。",en:"A spring under the mountain — ignorance to be enlightened, like water needing a channel."},lines:["初六：发蒙，利用刑人，用说桎梏，以往吝。","九二：包蒙吉，纳妇吉，子克家。","六三：勿用取女，见金夫，不有躬，无攸利。","六四：困蒙，吝。","六五：童蒙，吉。","上九：击蒙，不利为寇，利御寇。"],lineImage:[{zh:"启蒙之初，宜先立规矩，但不可操之过急。",en:"Begin education with discipline, but do not rush ahead."},{zh:"包容蒙昧者吉祥；娶妻吉祥，孩子能持家。",en:"Embrace the ignorant; take a wife; the son can manage the house."},{zh:"不要娶见钱眼开、不守正道的女子，无所利。",en:"Don't marry the woman who chases gold — nothing gained."},{zh:"困于蒙昧而孤立无援，有憾。",en:"Trapped in ignorance, alone — regret."},{zh:"如孩童般虚心求教，吉祥。",en:"Childlike openness to learn — good fortune."},{zh:"惩戒蒙昧——不宜为寇作乱，宜抵御外寇。",en:"Strike at ignorance — not to bully, but to defend."}]},水天需:{image:{zh:"云上于天，等待时机——有所需求时守正待时，如等云化雨。",en:"Clouds gathering in the sky — wait for the right moment, as rain waits to fall."},lines:["初九：需于郊，利用恒，无咎。","九二：需于沙，小有言，终吉。","九三：需于泥，致寇至。","六四：需于血，出自穴。","九五：需于酒食，贞吉。","上六：入于穴，有不速之客三人来，敬之终吉。"],lineImage:[{zh:"在郊外等待，远离是非，保持恒心，无咎。",en:"Wait in the outskirts, away from trouble; keep steady, no blame."},{zh:"在沙滩等待，已接近险地，小有口舌，终吉。",en:"Waiting on the sand — near the danger; some gossip, but all ends well."},{zh:"在泥沼中等待，已招致寇仇，再进则险。",en:"Waiting in the mud — you've attracted robbers; push no further."},{zh:"在血泊中等待，终于从洞穴中逃出——入险而能出。",en:"Wait even in blood, and escape the cave — through danger, out again."},{zh:"在酒食中安待，守正吉祥。",en:"Wait at the feast — calm and correct, good fortune."},{zh:"入于穴中，三位不速之客来访，以敬待之，终吉。",en:"In the cave three uninvited guests come; receive them with respect and all ends well."}]},天水讼:{image:{zh:"天与水违行——争讼之象，上刚下险，争而不宁，终非吉事。",en:"Heaven and water pull apart — litigation; contention brings no peace."},lines:["初六：不永所事，小有言，终吉。","九二：不克讼，归而逋，其邑人三百户，无眚。","六三：食旧德，贞厉，终吉。或从王事，无成。","九四：不克讼，复即命，渝安贞，吉。","九五：讼，元吉。","上九：或锡之鞶带，终朝三褫之。"],lineImage:[{zh:"不长久纠缠争讼，小有口舌，终吉。",en:"Don't drag the dispute out; some words exchanged, but it ends well."},{zh:"争讼不胜，逃回家乡——小邑三百户可保无灾。",en:"Lose the lawsuit, flee home; a small town of 300 households keeps you safe."},{zh:"安享旧日俸禄，守正防危，终吉；跟从做事而不居功。",en:"Live on your old salary; stay correct and all ends well."},{zh:"争讼不胜，回头安守本分，改变态度，吉祥。",en:"Lose and return to your station; change your stance — good."},{zh:"以公正裁断讼事，至为吉祥。",en:"Judge the case fairly — supreme good fortune."},{zh:"纵然胜诉获赐腰带，一日之内也会被剥夺三次——胜讼亦是空。",en:"Win the belt, lose it thrice by morning — even victory in court is hollow."}]},地水师:{image:{zh:"地中有水，众之象——兴师动众如蓄水，须老成持重方能无咎。",en:"Water in the earth — the massed many; an army needs a seasoned commander."},lines:["初六：师出以律，否臧凶。","九二：在师中，吉无咎，王三锡命。","六三：师或舆尸，凶。","六四：师左次，无咎。","六五：田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。","上六：大君有命，开国承家，小人勿用。"],lineImage:[{zh:"出兵必须以纪律约束，纪律不善则凶。",en:"March under strict discipline; without it, defeat."},{zh:"主帅居中得吉，君王三次赐命嘉奖。",en:"The general in the midst of the army — the king rewards him thrice."},{zh:"军队可能载着尸体回来——用人不当，凶险。",en:"The army may come back with corpses — misused force ends badly."},{zh:"军队退守驻扎，无咎。",en:"Withdraw and camp; no blame."},{zh:"田中有禽兽，兴师有名；长子统帅则吉，弟子统帅则凶。",en:"Game in the field justifies the hunt; the eldest son leads well, the younger brings corpses."},{zh:"功成论赏，封邦建国；小人不可重用。",en:"After victory, grant fiefs — but never employ petty men."}]},水地比:{image:{zh:"水在地上——亲比之象，众人归附如百川归海，宜早不宜迟。",en:"Water on the earth — union; all streams gather to the sea. Join early, not late."},lines:["初六：有孚比之，无咎。有孚盈缶，终来有他，吉。","六二：比之自内，贞吉。","六三：比之匪人。","六四：外比之，贞吉。","九五：显比，王用三驱，失前禽。邑人不诫，吉。","上六：比之无首，凶。"],lineImage:[{zh:"心怀诚信去亲附，如瓦罐盛满美酒，终有意外之吉。",en:"Attach with sincerity, a jar brimming with wine — unexpected good comes."},{zh:"从内部、从自身做起去亲附，守正吉祥。",en:"Union from within — correct and good."},{zh:"亲附了不该亲附的人。",en:"You ally with the wrong person."},{zh:"向外亲附贤者，守正吉祥。",en:"Turn outward and join the worthy — good."},{zh:"光明正大地亲附，如王狩猎三面包围、网开一面，邑人不诫而吉。",en:"Open union — the king hunts on three sides, leaving one open; no fear, all good."},{zh:"想亲附却已错过时机，无人牵头，凶。",en:"Come to union headless and late — misfortune."}]},风天小畜:{image:{zh:"风行天上，密云不雨——蓄积未足，小事可成，大事尚需等待。",en:"Wind in the sky — dense clouds, no rain; store up; small deeds only for now."},lines:["初九：复自道，何其咎，吉。","九二：牵复，吉。","九三：舆说辐，夫妻反目。","六四：有孚，血去惕出，无咎。","九五：有孚挛如，富以其邻。","上九：既雨既处，尚德载，妇贞厉。月几望，君子征凶。"],lineImage:[{zh:"回到自己的道路上，有什么过错呢？吉祥。",en:"Return to your own path — what blame? Good."},{zh:"被牵引着回归正道，吉祥。",en:"Pulled back onto the path — good."},{zh:"车轮脱辐，夫妻反目——强行前进反生内乱。",en:"The wheel loses its spokes; husband and wife turn on each other."},{zh:"有诚信，忧惧和伤害得以排除，无咎。",en:"With sincerity, fear and bloodshed drain away — no blame."},{zh:"以诚信牵系众邻，共富吉祥。",en:"Bind your neighbors with trust — shared wealth."},{zh:"雨已下已止，德已积载；月近圆时君子急进则凶。",en:"The rain has fallen and stopped; the harvest is loaded. Near the full moon, advance brings harm."}]},天泽履:{image:{zh:"上天下泽，如履虎尾——以礼而行，小心翼翼踩过虎尾而不被咬。",en:"Treading on the tiger's tail — act with courtesy and care, and it won't bite."},lines:["初九：素履，往无咎。","九二：履道坦坦，幽人贞吉。","六三：眇能视，跛能履，履虎尾，咥人，凶。武人为于大君。","九四：履虎尾，愬愬，终吉。","九五：夬履，贞厉。","上九：视履考祥，其旋元吉。"],lineImage:[{zh:"朴素无华地践行，前往无咎。",en:"Tread plainly, without ornament — no blame."},{zh:"走在平坦大道上，幽静守正之人吉祥。",en:"Walk the level road; the quiet hermit prospers."},{zh:"瞎眼强看、跛脚强行，踩虎尾而被咬——才不足而居高位，凶。",en:"A blind eye that sees, a lame leg that walks; it treads the tiger tail and gets bitten."},{zh:"踩着虎尾而心存畏惧，终获吉祥。",en:"Tread the tail with trembling care — good fortune in the end."},{zh:"刚断果决地践行，须防危厉。",en:"Tread with hard resolve — beware of the risk."},{zh:"回顾所行，考察吉凶，周旋圆满，元吉。",en:"Look back on the journey, judge its fortune — all comes full circle, supreme good."}]},地天泰:{image:{zh:"天地交而万物通——上下和畅，小往大来，通泰之世。",en:"Heaven and earth in harmony — the small departs, the great arrives; a time of peace."},lines:["初九：拔茅茹，以其汇，征吉。","九二：包荒，用冯河，不遐遗，朋亡，得尚于中行。","九三：无平不陂，无往不复，艰贞无咎。勿恤其孚，于食有福。","六四：翩翩不富，以其邻，不戒以孚。","六五：帝乙归妹，以祉元吉。","上六：城复于隍，勿用师。自邑告命，贞吝。"],lineImage:[{zh:"拔茅草根根相连——与同类共进，吉祥。",en:"Pull one grass, the roots come together — advance with your kind, good."},{zh:"包容荒野、徒步涉河、不遗远方、不结私党，合乎中道。",en:"Embrace the wild, ford the river, forget nothing, keep no clique — hold to the middle way."},{zh:"没有只平不陂的，没有只往不复的；守艰持正则有福可食。",en:"No plain without a slope, no going without returning; hold firm in hard times — there is blessing to eat."},{zh:"轻虚不富，以诚待邻——不召而互信，虚怀下贤。",en:"Light and unrich with neighbors, trust without summons — humility gathers allies."},{zh:"帝乙嫁妹下嫁贤者，以此得福，元吉。",en:"The king's daughter marries down — blessing follows, supreme good."},{zh:"城墙塌回壕沟，勿用兵力；自邑传令，守正防吝。",en:"The wall crumbles back into the moat — no force; issue orders from your own town."}]},天地否:{image:{zh:"天地不交，闭塞之世——君子藏器于身，待时而动。",en:"Heaven and earth do not meet — a closed age; the wise hide their light and wait."},lines:["初六：拔茅茹，以其汇，贞吉亨。","六二：包承，小人吉，大人否亨。","六三：包羞。","九四：有命无咎，畴离祉。","九五：休否，大人吉。其亡其亡，系于苞桑。","上九：倾否，先否后喜。"],lineImage:[{zh:"拔茅连根——守正吉祥，君子以类而退，不可同流。",en:"Pull the grass by its roots — stay correct; the noble withdraw with their own kind."},{zh:"包容承顺：小人得吉，大人于否闭中自有亨通。",en:"Bear and endure: the petty man gains, the great man keeps his own course in the dark."},{zh:"包容羞辱，忍耻图存。",en:"Swallow the shame and endure."},{zh:"奉行天命则无咎，众人同受福祉。",en:"Follow the mandate — no blame; your kin share the blessing."},{zh:"休止否运，大人吉祥；时时自警「其亡其亡」，根系如苞桑。",en:'Stop the decline — the great man prevails; keep crying "it may perish!" and root deep like the mulberry.'},{zh:"倾覆否运，先否后喜。",en:"Topple the closed age — first blockage, then joy."}]},天火同人:{image:{zh:"天与火同明——与人同心，聚众于野，大公无私则亨通。",en:"Fire rises to heaven — fellowship in the open; join with all, not just your clan."},lines:["初九：同人于门，无咎。","六二：同人于宗，吝。","九三：伏戎于莽，升其高陵，三岁不兴。","九四：乘其墉，弗克攻，吉。","九五：同人，先号咷而后笑。大师克相遇。","上九：同人于郊，无悔。"],lineImage:[{zh:"出门即与人和同，无咎。",en:"Union at the gate — no blame, open to all."},{zh:"只与宗族和同，褊狭而有憾。",en:"Union only with the clan — narrow, regrettable."},{zh:"埋伏兵于草莽，登高窥视——疑惧太深，三年不敢兴兵。",en:"Ambush in the grass, watch from the hill — three years no campaign; suspicion runs too deep."},{zh:"登上城墙却不能进攻，知止回头，吉祥。",en:"On the wall but cannot attack; turn back — good."},{zh:"先哭后笑——大军相遇，同心之庆。",en:"First wailing, then laughter — the armies meet as one."},{zh:"和同于郊野，虽无私交亦无悔。",en:"Union in the outskirts — no close bonds, no regret."}]},火天大有:{image:{zh:"火在天上，普照万物——大有所获，丰盛富有之卦。",en:"Fire in the sky — possession in great measure; abundance under bright light."},lines:["初九：无交害，匪咎，艰则无咎。","九二：大车以载，有攸往，无咎。","九三：公用亨于天子，小人弗克。","九四：匪其彭，无咎。","六五：厥孚交如，威如，吉。","上九：自天祐之，吉无不利。"],lineImage:[{zh:"不交往于害，本非过错，但须牢记艰难方能无咎。",en:"No entanglement in harm — not at fault, but remember hardship to stay safe."},{zh:"用大车装载，任重道远而无所咎。",en:"A big cart carries the load — go far, no blame."},{zh:"公侯向天子献贡——小人不能担当此任。",en:"The lord presents tribute to the throne — the petty man cannot bear the role."},{zh:"不炫耀其盛大，无咎。",en:"Not puffed up with abundance — no blame."},{zh:"以诚信交往，威严自生，吉祥。",en:"Trust exchanged with dignity — good."},{zh:"上天保佑，吉无不利。",en:"Help from heaven — nothing that does not prosper."}]},地山谦:{image:{zh:"地中有山，谦之象——高能下，有而不居，君子有终。",en:"A mountain in the earth — high yet lowly; hold power without flaunting it, and endure."},lines:["初六：谦谦君子，用涉大川，吉。","六二：鸣谦，贞吉。","九三：劳谦，君子有终，吉。","六四：无不利，撝谦。","六五：不富以其邻，利用侵伐，无不利。","上六：鸣谦，利用行师，征邑国。"],lineImage:[{zh:"谦而又谦的君子，可以涉越大川，吉祥。",en:"Doubly humble — fit even to cross the great river; good."},{zh:"谦名远播而守正，吉祥。",en:"Humility that rings out, held firm — good."},{zh:"有功劳而仍谦虚，君子至终吉祥。",en:"Merit yet humility — the noble endures well."},{zh:"发挥谦德，无所不利。",en:"Spread humility everywhere — nothing unfavorable."},{zh:"不富而仍愿与邻共利，宜于除暴，无不利。",en:"Not rich yet shares with neighbors — fit to campaign against tyranny."},{zh:"谦声播于外，宜于行师征讨邑国。",en:"Renowned humility — fit to lead the army."}]},雷地豫:{image:{zh:"雷出地奋——和乐安逸之时，利在顺势而动，戒在沉溺。",en:"Thunder from the earth — enthusiasm; ride the joyful moment, but don not sink into it."},lines:["初六：鸣豫，凶。","六二：介于石，不终日，贞吉。","六三：盱豫，悔。迟有悔。","九四：由豫，大有得。勿疑，朋盍簪。","六五：贞疾，恒不死。","上六：冥豫，成有渝，无咎。"],lineImage:[{zh:"以安逸自鸣得意，凶。",en:"Crowing over comfort — misfortune."},{zh:"耿介如石，不终日而断——见几而作，守正吉祥。",en:"Hard as a rock, deciding before the day ends — seize the sign early, good."},{zh:"媚眼向上求安逸，有悔；悔悟太迟，更有悔。",en:"Looking up for favors brings regret; late regret doubles it."},{zh:"众人由他得安乐，大有所得；勿疑，朋友像簪子束发一样聚拢。",en:"The source of joy — all gather to him like hair bound by the pin."},{zh:"守正以防疾患——如久病而不亡，持之以恒。",en:"Chronic ailment that never kills — hold firm and persist."},{zh:"昏暗于逸乐之中，若能改变则无咎。",en:"Lost in dark pleasures; change, and there is no blame."}]},泽雷随:{image:{zh:"泽中有雷，随之象——刚来下柔，随时而动，择善而随之。",en:"Thunder in the lake — following; move with the time, choose well whom you follow."},lines:["初九：官有渝，贞吉。出门交有功。","六二：系小子，失丈夫。","六三：系丈夫，失小子。随有求得，利居贞。","九四：随有获，贞凶。有孚在道，以明，何咎。","九五：孚于嘉，吉。","上六：拘系之，乃从维之。王用亨于西山。"],lineImage:[{zh:"官职有变，守正吉祥；出门交友必有所得。",en:"The office changes — stay correct; go out and engage, it works."},{zh:"拴住了小子，就失去了丈夫——因小失大。",en:"Tie yourself to the lad, lose the man — small gain, big loss."},{zh:"拴住丈夫，失去小子；随从有求必得，安居守正。",en:"Tie to the man, let the lad go; seeking brings gain — stay settled."},{zh:"随从有所获，须守正防凶；心存诚信、光明磊落，有何过错？",en:"Gains from following — beware; keep sincere and open, and no blame."},{zh:"诚信于美善，吉祥。",en:"Trust in what is good — good fortune."},{zh:"被拘系而随从，如此紧密；王以此祭享于西山。",en:"Bound and held fast — the king sacrifices on the western mountain."}]},山风蛊:{image:{zh:"山风蛊——器久不用生虫，积弊待治，整饬旧事之时。",en:"Worms in the vessel — long neglect breeds decay; time to repair what has rotted."},lines:["初六：干父之蛊，有子，考无咎，厉终吉。","九二：干母之蛊，不可贞。","九三：干父之蛊，小有悔，无大咎。","六四：裕父之蛊，往见吝。","六五：干父之蛊，用誉。","上九：不事王侯，高尚其事。"],lineImage:[{zh:"匡正父辈的积弊，有子如此，父亲无咎；虽危终吉。",en:"Mend the father's errors — the son saves the father; risky but good in the end."},{zh:"匡正母辈的积弊，不可过于刚直。",en:"Mend the mother's errors — don't be too rigid."},{zh:"匡正父弊，小有悔恨，无大咎。",en:"Mend the father's errors — small regrets, no great blame."},{zh:"对父辈积弊宽容拖延，发展下去必有憾。",en:"Going easy on the rot — delay brings regret."},{zh:"匡正父弊而赢得赞誉。",en:"Mend the father's errors and earn praise."},{zh:"不事王侯，高尚其志——整治之后功成身退。",en:"Serve no lord — let the work stand and retire in honor."}]},地泽临:{image:{zh:"泽上有地，临之象——阳气渐长，以上临下，生机正盛但盛极有衰。",en:"Earth over the lake — approach; yang grows strong, but remember August s turn."},lines:["初九：咸临，贞吉。","九二：咸临，吉无不利。","六三：甘临，无攸利。既忧之，无咎。","六四：至临，无咎。","六五：知临，大君之宜，吉。","上六：敦临，吉无咎。"],lineImage:[{zh:"以感化临民，守正吉祥。",en:"Lead by influence — correct and good."},{zh:"以感化临民，吉祥无所不利。",en:"Lead by influence — nothing unfavorable."},{zh:"以甜言蜜语临人，无所利；既已忧惧改过，则无咎。",en:"Sweet talk gains nothing; once you worry and mend, no blame."},{zh:"亲自下临，无咎。",en:"Approach in person — no blame."},{zh:"以智慧临下，大君之宜，吉祥。",en:"Rule with wisdom — fitting for the great leader; good."},{zh:"敦厚临下，吉祥无咎。",en:"Approach with deep sincerity — good, no blame."}]},风地观:{image:{zh:"风行地上，观之象——如风行大地遍及万物，先观人而后使人观己。",en:"Wind over the earth — contemplation; see far and wide, and be worth watching."},lines:["初六：童观，小人无咎，君子吝。","六二：窥观，利女贞。","六三：观我生，进退。","六四：观国之光，利用宾于王。","九五：观我生，君子无咎。","上九：观其生，君子无咎。"],lineImage:[{zh:"如孩童般浅观，小人无妨，君子则吝。",en:"The child's gaze — fine for the petty, shameful for the noble."},{zh:"从门缝偷看，所见褊狭——利于女子守正。",en:"Peeking through the door — narrow sight, fit only for the woman s correctness."},{zh:"反观自己的行为，以定进退。",en:"Watch your own life to choose advance or retreat."},{zh:"观仰国之光辉，宜于作宾于王朝。",en:"See the light of the kingdom — fit to be the king s guest."},{zh:"君主反观民生，君子无咎。",en:"The ruler watches the people s lives — no blame."},{zh:"观仰他国之生民，君子无咎。",en:"Watch the lives of other lands — no blame."}]},火雷噬嗑:{image:{zh:"雷电合章，咬合之象——口中梗物，咬合而除之，利用刑法。",en:"Thunder and lightning — biting through; the obstacle between the jaws must be chewed; law serves."},lines:["初九：屦校灭趾，无咎。","六二：噬肤灭鼻，无咎。","六三：噬腊肉，遇毒；小吝，无咎。","九四：噬干胏，得金矢，利艰贞，吉。","六五：噬干肉，得黄金，贞厉，无咎。","上九：何校灭耳，凶。"],lineImage:[{zh:"脚戴刑具遮没脚趾——小惩大诫，无咎。",en:"Shackles hide the toes — a small punishment that teaches; no blame."},{zh:"咬软肉而没鼻——用刑及时，无咎。",en:"Bite the skin, nose buried — press the soft case, no blame."},{zh:"咬腊肉遇毒——施刑遇怨，小吝无咎。",en:"Biting dried meat, meeting poison — small trouble, no blame."},{zh:"咬干骨得铜箭——刚直之象，利于艰难守正，吉祥。",en:"Biting bone, finding the bronze arrow — firm justice in hard times; good."},{zh:"咬干肉得黄金——柔中藏刚，守正防危，无咎。",en:"Biting dried meat, finding gold — gentleness with a core; hold firm, no blame."},{zh:"肩扛重枷遮没耳朵——积恶不改，凶。",en:"The cangue hides the ears — unrepentant crime ends badly."}]},山火贲:{image:{zh:"山下有火，贲之象——文饰之美，锦上添花；质为本，饰为末。",en:"Fire at the foot of the mountain — grace; ornament adorns substance, but substance rules."},lines:["初九：贲其趾，舍车而徒。","六二：贲其须。","九三：贲如濡如，永贞吉。","六四：贲如皤如，白马翰如，匪寇婚媾。","六五：贲于丘园，束帛戋戋，吝，终吉。","上九：白贲，无咎。"],lineImage:[{zh:"装饰脚趾，舍车而徒步——宁可质朴步行，不乘华车。",en:"Adorn the toes, walk rather than ride — plain steps over showy carriage."},{zh:"装饰胡须——文饰须有所依附（依附本质）。",en:"Adorn the beard — ornament follows what it adorns."},{zh:"文采焕然、润泽盈盈，长久守正则吉。",en:"Glowing and moist with grace — hold firm long, good."},{zh:"素白文饰，白马翰如——不是寇仇，是来求婚配的。",en:"White simplicity, a white horse soaring — no robber, but a suitor."},{zh:"装饰丘园，束帛微薄——看似吝啬，终获吉祥。",en:"Grace for the hill garden, silk meager as it seems — good in the end."},{zh:"以纯白为饰，返璞归真，无咎。",en:"White grace — ornament stripped to plainness; no blame."}]},山地剥:{image:{zh:"山附于地，剥之象——五阴剥一阳，大厦将倾，硕果仅存。",en:"The mountain crumbles — five yin strip away one yang; one fruit hangs on."},lines:["初六：剥床以足，蔑贞凶。","六二：剥床以辨，蔑贞凶。","六三：剥之，无咎。","六四：剥床以肤，凶。","六五：贯鱼，以宫人宠，无不利。","上九：硕果不食，君子得舆，小人剥庐。"],lineImage:[{zh:"剥蚀床脚，正道被蔑，凶。",en:"The bed decays from the feet — the base is eaten, misfortune."},{zh:"剥蚀床板，凶。",en:"The frame of the bed decays — misfortune."},{zh:"与众相剥而独应上阳——处剥而能附阳，无咎。",en:"Alone it clings to the single yang — in the decay, no blame."},{zh:"剥蚀到肌肤，切近之灾，凶。",en:"The bed eats into the skin — disaster at hand."},{zh:"贯鱼以宫人宠——率领众阴顺承上阳，无不利。",en:"Fish on a string, palace ladies in turn — lead the yin to serve the yang; nothing unfavorable."},{zh:"硕大的果实不被吃掉——君子得车（为民所载），小人自毁其屋。",en:"The great fruit uneaten: the noble gets a carriage, the petty lose their roof."}]},地雷复:{image:{zh:"雷在地中，一阳来复——冬至阳生，七日来复，循环往复之机。",en:"Thunder in the earth — one yang returns; the light comes back after seven days."},lines:["初九：不远复，无祗悔，元吉。","六二：休复，吉。","六三：频复，厉无咎。","六四：中行独复。","六五：敦复，无悔。","上六：迷复，凶，有灾眚。用行师，终有大败；以其国君，凶；至于十年，不克征。"],lineImage:[{zh:"走得不远就返回，没有大的悔恨，元吉。",en:"Return soon after straying — no great regret, supreme good."},{zh:"休美地回归正道，吉祥。",en:"Return in beauty — good."},{zh:"频频犯错又频频复归——虽危无咎。",en:"Return again and again — risky but no blame."},{zh:"行于众人之中而独自回归正道。",en:"Walk mid-crowd but return alone."},{zh:"敦厚地复归，无悔。",en:"Return with deep sincerity — no regret."},{zh:"迷失而不复返，凶；用兵终有大败，十年不能征。",en:"Lost, never returning — misfortune; armies fail, ten years no campaign."}]},天雷无妄:{image:{zh:"天下雷行，无妄之象——真实无伪，顺天而行，妄动则有眚。",en:"Thunder under heaven — innocence; act without contrivance, and don t force what isn t true."},lines:["初九：无妄，往吉。","六二：不耕获，不菑畬，则利有攸往。","六三：无妄之灾，或系之牛，行人之得，邑人之灾。","九四：可贞，无咎。","九五：无妄之疾，勿药有喜。","上九：无妄，行有眚，无攸利。"],lineImage:[{zh:"真诚无妄，前往吉祥。",en:"Innocent advance — good."},{zh:"不耕种就想收获、不开荒就想熟田——不存妄想，则利有攸往。",en:"No plowing yet expecting harvest — drop expectations, then go."},{zh:"村人的牛被路人牵走，村人却遭殃——飞来横祸。",en:"An innocent s cow is taken by a passer-by — blameless yet stricken."},{zh:"守正可行，无咎。",en:"Hold your ground — no blame."},{zh:"不招而自来的病，不必服药，自愈有喜。",en:"Sickness without cause — no medicine needed; it passes with joy."},{zh:"本无虚妄，强行作为亦有过失，无所利。",en:"Even innocence forced into action meets harm — nothing gained."}]},山天大畜:{image:{zh:"天在山中，大畜之象——蓄积至大，良马充实，宜养精蓄锐以涉大川。",en:"Heaven in the mountain — great accumulation; store strength like stabled horses."},lines:["初九：有厉，利已。","九二：舆说輹。","九三：良马逐，利艰贞。曰闲舆卫，利有攸往。","六四：童牛之牿，元吉。","六五：豮豕之牙，吉。","上九：何天之衢，亨。"],lineImage:[{zh:"有危险，宜停止不进。",en:"Danger — better stop."},{zh:"车轮脱了轴——主动停止，不进则安。",en:"The cart sheds its axle — stop willingly."},{zh:"良马奔驰，宜于艰难中守正；习熟车马防卫，则利有攸往。",en:"Good horses racing — practice hard, keep steady, then advance."},{zh:"给幼牛角上横木——防患于未然，元吉。",en:"Bridle the calf s horns — prevent early, supreme good."},{zh:"阉猪之牙——去其暴性，吉祥。",en:"The gelded boar s tusks — tame the violence, good."},{zh:"何其畅通的天街大道——蓄积已极，亨通无碍。",en:"The open highway of heaven — accumulation complete, the way runs free."}]},山雷颐:{image:{zh:"山下有雷，颐之象——颐养之道，自食其力，慎言语、节饮食。",en:"Thunder under the mountain — the jaws; nourish rightly: watch words, moderate food."},lines:["初九：舍尔灵龟，观我朵颐，凶。","六二：颠颐，拂经，于丘颐，征凶。","六三：拂颐，贞凶，十年勿用，无攸利。","六四：颠颐吉，虎视眈眈，其欲逐逐，无咎。","六五：拂经，居贞吉，不可涉大川。","上九：由颐，厉吉，利涉大川。"],lineImage:[{zh:"舍弃你的灵龟（自养之宝），却看我鼓腮而食，凶。",en:"You drop your sacred tortoise to watch me eat — misfortune."},{zh:"颠倒求养、违背常理，于丘上求食，前往凶险。",en:"Begging upside down against all order — advance brings harm."},{zh:"违背颐养之道，守正亦凶，十年不可用。",en:"Against nourishment itself — ten years unusable, nothing gained."},{zh:"上者下求于初而吉——如虎注视，求贤之欲迫切，无咎。",en:"Above seeking below — like the tiger s fixed gaze; no blame."},{zh:"违背常道但安居守正，吉祥；不可涉大川。",en:"Against convention yet settled and correct — good; cross no great river."},{zh:"天下由其而得养——居此重任虽危亦吉，利涉大川。",en:"All are nourished through him — weighty yet good; fit to cross rivers."}]},泽风大过:{image:{zh:"泽灭木，大过之象——负重过甚，栋梁弯曲，非常之时须非常之举。",en:"The lake floods the trees — the ridgepole sags under too much weight; extraordinary times."},lines:["初六：藉用白茅，无咎。","九二：枯杨生稊，老夫得其女妻，无不利。","九三：栋桡，凶。","九四：栋隆，吉；有它吝。","九五：枯杨生华，老妇得其士夫，无咎无誉。","上六：过涉灭顶，凶，无咎。"],lineImage:[{zh:"以白茅衬垫祭品——敬慎之至，无咎。",en:"White straw beneath the offering — utmost care; no blame."},{zh:"枯杨树生新芽，老夫娶得少女，无不利。",en:"The willow sprouts anew; the old man takes a young wife — nothing unfavorable."},{zh:"栋梁弯曲，凶。",en:"The ridgepole sags — misfortune."},{zh:"栋梁隆起——负重得辅，吉祥；若再有它求则吝。",en:"The ridgepole arches up — good; reach for more and regret."},{zh:"枯杨开花——华而不实，老妇配得少夫，无咎也无誉。",en:"The willow blooms without fruit; the old wife and young husband — neither blame nor praise."},{zh:"涉水过深淹没头顶——冒险救时，虽凶而无咎。",en:"Wading till the water closes over the head — fatal risk taken for the times; blameless."}]},坎为水:{image:{zh:"习坎，重险之象——水洊至，险中设险；有诚信则能维心亨通。",en:"The doubled abyss — danger repeated; only sincerity carries the heart through."},lines:["初六：习坎，入于坎窞，凶。","九二：坎有险，求小得。","六三：来之坎坎，险且枕，入于坎窞，勿用。","六四：樽酒簋贰，用缶，纳约自牖，终无咎。","九五：坎不盈，祗既平，无咎。","上六：系用徽纆，寘于丛棘，三岁不得，凶。"],lineImage:[{zh:"重重险陷，落入深穴，凶。",en:"Falling from the pit into the pit within — misfortune."},{zh:"险中有险，只可求小得，不可图大。",en:"Danger within danger — seek only small gains."},{zh:"来去皆险，倚靠亦险——入于深穴，勿用。",en:"Coming and going both peril — useless to act."},{zh:"一樽酒、两簋饭，用瓦器，从窗户递入简约的盟约——终究无咎。",en:"A jug of wine, two bowls, clay vessels, the vow through the window — simple sincerity ends well."},{zh:"险水未满，刚刚平齐——险将出而未出，无咎。",en:"The water never quite fills the pit — level, not yet spilling; no blame."},{zh:"被绳索捆缚，置于荆棘之中，三年不得脱身，凶。",en:"Bound with cords, cast among thorns — three years no release; misfortune."}]},离为火:{image:{zh:"离为火，附丽之象——日月丽天，光明依附于可燃之物，宜畜养柔顺。",en:"Fire clings — brightness needs fuel; attach to what endures, keep the cow gentle."},lines:["初九：履错然，敬之无咎。","六二：黄离，元吉。","九三：日昃之离，不鼓缶而歌，则大耋之嗟，凶。","九四：突如其来如，焚如，死如，弃如。","六五：出涕沱若，戚嗟若，吉。","上九：王用出征，有嘉折首，获匪其丑，无咎。"],lineImage:[{zh:"步履交错、事务繁忙，心存敬慎则无咎。",en:"Steps crisscross, busy to and fro — stay reverent, no blame."},{zh:"黄色的光明（中色附丽），元吉。",en:"Yellow light, centered and bright — supreme good."},{zh:"日过中天向西偏——不击缶而歌，则老暮之嗟，凶。",en:"The sun past noon; sing to the drum or mourn old age — misfortune."},{zh:"突然而来，焚烧、死亡、弃绝——急进之祸。",en:"Comes sudden as fire — burns, dies, is cast away."},{zh:"泪水滂沱、忧戚嗟叹——居尊知惧，终得吉祥。",en:"Tears stream, sighs deep — the ruler who fears prospers."},{zh:"君王出征，嘉奖斩首之功，俘获不滥及其类，无咎。",en:"The king campaigns — honors for the leaders, captives spared; no blame."}]},泽山咸:{image:{zh:"山上有泽，咸之象——二气感应以相与，少男在下谦承少女，交感而通。",en:"The lake on the mountain — mutual influence; feeling moves all things."},lines:["初六：咸其拇。","六二：咸其腓，凶，居吉。","九三：咸其股，执其随，往吝。","九四：贞吉悔亡，憧憧往来，朋从尔思。","九五：咸其脢，无悔。","上六：咸其辅，颊，舌。"],lineImage:[{zh:"感应到脚趾——感之初动，尚且微弱。",en:"Feeling reaches the big toe — the first flicker."},{zh:"感应到小腿肚——躁动妄随则凶，安居守静则吉。",en:"Feeling in the calves — rush and it is harm; stay still and it is good."},{zh:"感应到大腿——执其随身而动，前往必有憾。",en:"Feeling in the thigh — dragged along by what follows; regret if you go."},{zh:"守正吉祥、悔恨消亡；心神往来不定，朋友终随其诚。",en:"Correct, regret gone; let the heart wander and friends follow its truth."},{zh:"感应到脊背——居尊而感不周，无悔亦浅。",en:"Feeling in the back — the leader s touch cannot reach all; no regret, but thin."},{zh:"感应到牙床、脸颊、舌头——仅以言语相感，流于空泛。",en:"Feeling in jaw, cheek, tongue — words alone, mere talk."}]},雷风恒:{image:{zh:"雷风相与，恒之象——刚柔相应，恒久之道；立不易方，贵在有常。",en:"Thunder and wind — duration; what lasts is not what stands still but what moves rightly forever."},lines:["初六：浚恒，贞凶，无攸利。","九二：悔亡。","九三：不恒其德，或承之羞，贞吝。","九四：田无禽。","六五：恒其德，贞，妇人吉，夫子凶。","上六：振恒，凶。"],lineImage:[{zh:"求恒过深、一开始就想长久，守正亦凶，无所利。",en:"Digging for permanence too deep at the start — harm even when correct."},{zh:"恒心不足之悔，因守中而亡。",en:"Regret fades — hold the middle."},{zh:"德行不能恒久，或蒙羞辱，守正亦吝。",en:"Virtue without constancy meets shame."},{zh:"田猎而无禽兽所获——居位不当，久劳无功。",en:"Hunting with no game — long effort, wrong place, nothing caught."},{zh:"恒久其德，守正；妇人吉祥，夫子则凶（各有其恒）。",en:"Constant virtue — good for the wife, binding for the husband."},{zh:"震动恒久之道——居上而躁动，凶。",en:"Shaking what should endure — misfortune."}]},天山遁:{image:{zh:"天下有山，遁之象——阴渐长而阳退避，急流勇退，远小人。",en:"The mountain under heaven — retreat; withdraw in good order before yin grows strong."},lines:["初六：遁尾，厉，勿用有攸往。","六二：执之用黄牛之革，莫之胜说。","九三：系遁，有疾厉，畜臣妾吉。","九四：好遁，君子吉，小人否。","九五：嘉遁，贞吉。","上九：肥遁，无不利。"],lineImage:[{zh:"退避落在最后，危险；勿再有所往。",en:"Retreat at the tail — danger; go no further."},{zh:"用黄牛皮绳拴住（志不肯退），无人能解。",en:"Bound with yellow oxhide — no one can loosen the hold."},{zh:"心有系恋而退避，有疾而危；蓄养臣妾则吉。",en:"Tied in retreat — sick with worry; keep servants and all is well."},{zh:"爱好虽系而能毅然退避，君子吉祥，小人不能。",en:"The noble withdraws though he loves it; the petty cannot."},{zh:"嘉美而退，守正吉祥。",en:"A fine, timely retreat — good."},{zh:"宽裕自得地退避，无所不利。",en:"The fat retreat — effortless, nothing unfavorable."}]},雷天大壮:{image:{zh:"雷在天上，大壮之象——阳刚盛长，声势浩大；壮而守正，勿恃壮妄为。",en:"Thunder in heaven — great power; strength at its peak must stay correct."},lines:["初九：壮于趾，征凶，有孚。","九二：贞吉。","九三：小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。","九四：贞吉悔亡，藩决不羸，壮于大舆之輹。","六五：丧羊于易，无悔。","上六：羝羊触藩，不能退，不能遂，无攸利，艰则吉。"],lineImage:[{zh:"壮在脚趾——以壮进动，前往凶险，但理直气壮。",en:"Strength in the toes — advancing on it brings harm."},{zh:"守正则吉（壮而得中）。",en:"Hold correct — good."},{zh:"公羊撞篱笆，角被缠住——小人恃壮，君子用网，守正防危。",en:"The ram butts the hedge and tangles its horns."},{zh:"篱笆破开、羊角脱出——壮于大车之轴，贞吉悔亡。",en:"The hedge breaks, horns free — strength like a cart axle; good, regret gone."},{zh:"在平易之处丧羊（壮极而返柔），无悔。",en:"Losing the ram in the easy field — no regret."},{zh:"公羊触篱，不能退也不能进——进退两难；知艰守正则吉。",en:"The ram tangled in the hedge, neither back nor forth — know the hardship, hold firm, good."}]},火地晋:{image:{zh:"明出地上，晋之象——旭日东升，晋升上进，明德日益昭明。",en:"The sun over the earth — progress; brightness rising, advance openly."},lines:["初六：晋如，摧如，贞吉。罔孚，裕无咎。","六二：晋如，愁如，贞吉。受兹介福，于其王母。","六三：众允，悔亡。","九四：晋如鼫鼠，贞厉。","六五：悔亡，失得勿恤，往吉无不利。","上九：晋其角，维用伐邑，厉吉无咎，贞吝。"],lineImage:[{zh:"晋升之中有摧折，守正吉祥；尚未取信于人，宽裕待之则无咎。",en:"Progress meets pushback — hold correct; untrusted yet, be generous and wait."},{zh:"晋升之中有愁虑，守正吉祥；从王母处受此大福。",en:"Progress with worry — good; the blessing comes from the grandmother."},{zh:"众人信允，悔恨消亡。",en:"All consent — regret gone."},{zh:"晋升如鼫鼠（贪而惧），守正防危。",en:"Progress like the marmot — greedy and afraid; beware."},{zh:"勿忧得失，前往吉祥，无所不利。",en:"Forget gain and loss — go, nothing unfavorable."},{zh:"进至角尖——只有征伐邑国一途，危而无咎，守正防吝。",en:"At the horn s tip — only the punitive campaign remains; risky, no blame."}]},地火明夷:{image:{zh:"明入地中，明夷之象——光明入于地下，黑暗之时，利艰贞，藏明待时。",en:"Light sunk into the earth — darkening; hide your light and endure the dark."},lines:["初九：明夷于飞，垂其翼。君子于行，三日不食，有攸往，主人有言。","六二：明夷，夷于左股，用拯马壮，吉。","九三：明夷于南狩，得其大首，不可疾贞。","六四：入于左腹，获明夷之心，出于门庭。","六五：箕子之明夷，利贞。","上六：不明晦，初登于天，后入于地。"],lineImage:[{zh:"明夷之鸟低飞、垂下翅膀——君子出行，三日不食。",en:"The bird flies low, wings drooping — the noble walks three days unfed."},{zh:"左股受伤，用强壮的马来拯救，吉祥。",en:"The left thigh wounded — saved by a strong horse; good."},{zh:"南郊狩猎，擒获元凶；不可操之过急。",en:"Hunting south, taking the chief — but no haste."},{zh:"深入左腹，获知黑暗之心，然后出于门庭。",en:"Into the left belly — learn the dark heart, then out the gate."},{zh:"如箕子佯狂自晦于黑暗之时，守正有利。",en:"Jizi s darkening — feigned madness, kept correct."},{zh:"不明而昏暗，起初登天，后来入地。",en:"Dark without light — first rising to heaven, then sinking into earth."}]},风火家人:{image:{zh:"风自火出，家人之象——内正而外化，家和万事兴，各安其位。",en:"Wind from the fire — the family; order within spreads outward; each in their place."},lines:["初九：闲有家，悔亡。","六二：无攸遂，在中馈，贞吉。","九三：家人嗃嗃，悔厉吉；妇子嘻嘻，终吝。","六四：富家，大吉。","九五：王假有家，勿恤吉。","上九：有孚威如，终吉。"],lineImage:[{zh:"治家之初即立防范，悔恨消亡。",en:"Guard the family early — regret gone."},{zh:"不专断外事，主持家中饮食，守正吉祥。",en:"No private agenda, tending the meals — correct and good."},{zh:"治家严厉，虽有悔有危而终吉；妇子嘻嘻放纵，终致吝咎。",en:"Severity at home — regret and risk, then good; giggling laxity ends badly."},{zh:"使家庭富足，大吉。",en:"Enrich the family — great good."},{zh:"君王以感格至其家，勿忧吉祥。",en:"The king reaches his family — no worry, good."},{zh:"以诚信发其威仪，终得吉祥。",en:"Trust with dignity — good in the end."}]},火泽睽:{image:{zh:"上火下泽，睽之象——二女同居其志不同，乖离之中藏有同异之趣。",en:"Fire above the lake — opposition; in difference, hidden accord."},lines:["初九：悔亡，丧马勿逐，自复；见恶人，无咎。","九二：遇主于巷，无咎。","六三：见舆曳，其牛掣，其人天且劓，无初有终。","九四：睽孤，遇元夫，交孚，厉无咎。","六五：悔亡，厥宗噬肤，往何咎。","上九：睽孤，见豕负涂，载鬼一车，先张之弧，后说之弧，匪寇婚媾，往遇雨则吉。"],lineImage:[{zh:"马丢了不必追，自己会回来；宽待恶人，无咎。",en:"Lose the horse, don t chase — it returns; meet the mean without blame."},{zh:"在小巷中遇见主人，无咎。",en:"Meet the lord in the alley — no blame."},{zh:"牛车被拖、牛被牵制，赶车人遭刑伤——起初艰难，终有好结果。",en:"The cart dragged, the ox held, the driver scarred — hard start, good end."},{zh:"乖离孤独，遇元夫，以诚信相交，危而无咎。",en:"Alone in opposition, meet the first yang — trust each other; risk, no blame."},{zh:"同宗如咬软肉般亲合，前往有何过错？",en:"Kin bites soft skin — closeness; go, what blame?"},{zh:"见猪背上涂泥、一车鬼怪——先张弓后收弓：不是寇仇是婚配；前往遇雨则吉祥。",en:"Pig in the mud, a cart of ghosts — draw the bow, then lower it: no robber, a wedding; rain comes, good."}]},水山蹇:{image:{zh:"水在山上，蹇之象——前有险陷，见险而止；利见大人，往蹇来誉。",en:"Water on the mountain — obstruction; see the danger and stop; the great help matters."},lines:["初六：往蹇，来誉。","六二：王臣蹇蹇，匪躬之故。","九三：往蹇来反。","六四：往蹇来连。","九五：大蹇朋来。","上六：往蹇来硕，吉；利见大人。"],lineImage:[{zh:"前往遇险，回来得誉（知难而退）。",en:"Go and stumble, return with praise."},{zh:"王臣屡蹈艰难，并非为自身私利。",en:"The king s servant struggles — not for himself."},{zh:"前往遇险，返回来复。",en:"Go, stumble, turn back."},{zh:"前往遇险，回来联合同类。",en:"Go, stumble, return and unite."},{zh:"大难之中，朋友来助。",en:"In great obstruction, friends arrive."},{zh:"前往遇险，回来大有收获；吉祥，利见大人。",en:"Go, stumble, return with gain — good; meet the great."}]},雷水解:{image:{zh:"雷雨作而万物甲坼，解之象——险难解除，如冰消瓦解，宜速不宜迟。",en:"Thunder and rain — deliverance; the knot unties, act swiftly while it does."},lines:["初六：无咎。","九二：田获三狐，得黄矢，贞吉。","六三：负且乘，致寇至，贞吝。","九四：解而拇，朋至斯孚。","六五：君子维有解，吉；有孚于小人。","上六：公用射隼于高墉之上，获之，无不利。"],lineImage:[{zh:"刚柔相济，难初即解，无咎。",en:"At the edge of trouble, no blame."},{zh:"田猎捕获三只狐狸，得到黄铜箭矢——除邪得中，守正吉祥。",en:"Three foxes in the hunt, a bronze arrow — cunning removed; good."},{zh:"背着包袱又乘车——小人装贵人，招致寇盗；守正防吝。",en:"Burdens on the back, riding in a cart — the petty playing grand invites robbers."},{zh:"解开拇指的牵制（摆脱小人），朋友以诚信到来。",en:"Loose the thumb from small entanglements — friends come in trust."},{zh:"君子解除系绊，吉祥；以诚信感化小人。",en:"The noble loosens the bond — good; trust reaches even the petty."},{zh:"王公射高墙之隼，一举获之——宜除巨恶，无所不利。",en:"The prince shoots the falcon from the high wall — take the great villain; nothing unfavorable."}]},山泽损:{image:{zh:"山泽损——损下益上，损而有孚；惩忿窒欲，损己所当损。",en:"Decrease below, increase above — lose with sincerity; curb anger, choke desire."},lines:["初九：已事遄往，无咎，酌损之。","九二：利贞，征凶，弗损益之。","六三：三人行，则损一人；一人行，则得其友。","六四：损其疾，使遄有喜，无咎。","六五：或益之十朋之龟，弗克违，元吉。","上九：弗损益之，无咎，贞吉，利有攸往。得臣无家。"],lineImage:[{zh:"办完自己的事急忙前往助祭，无咎；酌情减损。",en:"Finish your task, rush to help — no blame; moderate what you give."},{zh:"守正有利，急进则凶；弗损而益之。",en:"Hold firm; advance brings harm — don t decrease, increase."},{zh:"三人同行则损一人，一人独行则得其友。",en:"Three walk, one is lost; one walks, a friend is found."},{zh:"减损其疾患，使之速愈而有喜，无咎。",en:"Diminish the sickness quickly — joy and no blame."},{zh:"有人增益他价值十朋的灵龟，不能推辞，元吉。",en:"A tortoise worth ten pairs is given — cannot refuse; supreme good."},{zh:"不减损而增益下民，无咎守正吉祥；利有攸往，得臣无家。",en:"Without loss, there is gain — good; servants come from every house."}]},风雷益:{image:{zh:"风雷益——损上益下，民说无疆；木道乃行，迁善改过之卦。",en:"Wind and thunder — increase; cut from above, give below, the people rejoice without end."},lines:["初九：利用为大作，元吉，无咎。","六二：或益之十朋之龟，弗克违，永贞吉。王用享于帝，吉。","六三：益之用凶事，无咎。有孚中行，告公用圭。","六四：中行，告公从。利用为依迁国。","九五：有孚惠心，勿问元吉。有孚惠我德。","上九：莫益之，或击之，立心勿恒，凶。"],lineImage:[{zh:"宜于大有作为，元吉无咎（上之所益，足以担大任）。",en:"Fit for great works — supreme good, no blame."},{zh:"有人增益十朋之龟，不能推辞；永久守正吉祥，王以此祭享于天帝。",en:"The ten-pair tortoise — keep it, hold firm forever; the king sacrifices to heaven."},{zh:"增益用于凶荒之事，无咎；心存诚信、行乎中道，以圭告公。",en:"Gain used in calamity — no blame; report to the lord with the jade tablet."},{zh:"行于中道，告于公而见从；宜于依附迁国之事。",en:"Mid-course, the lord follows — fit to move the capital."},{zh:"有诚信惠心于下，不必问而元吉；民众亦诚信感戴其德。",en:"Trust with a generous heart — unasked, supreme good; the people repay in kind."},{zh:"没有人增益他，反而有人攻击他——立心无恒，凶。",en:"No one helps, some strike — an unsteady heart ends badly."}]},泽天夬:{image:{zh:"泽上于天，夬之象——五阳决一阴，当断则断；扬于王庭，孚号有厉。",en:"The lake swells to heaven — resolution; five yang decide the one yin; break openly."},lines:["初九：壮于前趾，往不胜为咎。","九二：惕号，莫夜有戎，勿恤。","九三：壮于頄，有凶。君子夬夬，独行遇雨，若濡有愠，无咎。","九四：臀无肤，其行次且。牵羊悔亡，闻言不信。","九五：苋陆夬夬，中行无咎。","上六：无号，终有凶。"],lineImage:[{zh:"脚趾强壮而急于前进，前往不胜反成过错。",en:"Strong toes rush ahead — failing forward becomes the fault."},{zh:"时刻警惕呼号，即使夜里有兵戎也不必忧虑。",en:"Cry alarm, stay alert — even night attack brings no worry."},{zh:"颧骨强壮显于面部，有凶；君子独断独行，虽遇雨沾湿、遭人愠怒，终无咎。",en:"Strength in the jaw — risky; walk alone, meet the rain, take the blame, no fault."},{zh:"臀部无肤，行走趑趄；牵羊而行则悔亡——若闻言不信，孤立无援。",en:"Sore seat, halting step — hold the sheep s lead and regret fades; deaf to advice, you stall."},{zh:"如斩断马齿苋般果决，行乎中道，无咎。",en:"Cutting purslane clean through — mid-course, no blame."},{zh:"不必号叫，终有凶险——孤阴被决，无可逃避。",en:"No cry avails — the end is harm."}]},天风姤:{image:{zh:"天下有风，姤之象——一阴遇五阳，不期而遇；女壮，勿用取女。",en:"Wind under heaven — coming to meet; one yin meets five yang; a force not to marry."},lines:["初六：系于金柅，贞吉。有攸往，见凶，羸豕孚蹢躅。","九二：包有鱼，无咎，不利宾。","九三：臀无肤，其行次且，厉，无大咎。","九四：包无鱼，起凶。","九五：以杞包瓜，含章，有陨自天。","上九：姤其角，吝，无咎。"],lineImage:[{zh:"拴在金属刹车器上，守正吉祥；若强行前往则见凶——如被系住的猪还要挣扎。",en:"Tied to the metal brake — good; break loose and meet harm."},{zh:"厨房里有鱼，无咎，但不宜用来待宾。",en:"Fish in the kitchen — no blame; don t serve it to guests."},{zh:"臀部无肤，行走趑趄，危厉；无大咎。",en:"Sore seat, halting step — risk but no great blame."},{zh:"厨房无鱼——远离民众，失其民则凶。",en:"No fish in the kitchen — misfortune rises."},{zh:"以杞柳包瓜，内含章美；机遇自天而降。",en:"The melon wrapped in willow — beauty held within; a fall from heaven."},{zh:"遇于角尖——处姤之终，仅免于祸，虽吝而无咎。",en:"Meeting at the horn s tip — narrow, no blame."}]},泽地萃:{image:{zh:"泽上于地，萃之象——荟萃聚集，如物聚于泽；王假有庙，聚众以正。",en:"The lake on earth — gathering; all waters meet; the king comes to the temple, gather rightly."},lines:["初六：有孚不终，乃乱乃萃，若号，一握为笑，勿恤，往无咎。","六二：引吉，无咎，孚乃利用禴。","六三：萃如，嗟如，无攸利，往无咎，小吝。","九四：大吉，无咎。","九五：萃有位，无咎。匪孚，元永贞，悔亡。","上六：赍咨涕洟，无咎。"],lineImage:[{zh:"有诚信而不能善终，因而乱而相聚；若号呼，一握之间化泣为笑——勿忧，前往无咎。",en:"Trust that wavers — disorder in the gathering; one grasp turns tears to laughter; go, no blame."},{zh:"被牵引而聚则吉，无咎；心怀诚信，薄祭亦可。",en:"Led into the gathering — good; sincere, a thin offering suffices."},{zh:"相聚而嗟叹，无所利；前往无咎，小有憾。",en:"Gathering with sighs — nothing gained; go, no blame, slight regret."},{zh:"大吉而后无咎（聚得其位，但须防专擅）。",en:"Great good, then no blame."},{zh:"聚得其位，无咎；若未能取信，唯有长久守正可致悔亡。",en:"Gathering in place — no blame; unproven trust needs long correctness."},{zh:"叹息流涕——居萃之终，聚极而散，知惧故无咎。",en:"Sighs and tears at the end of the gathering — no blame through awareness."}]},地风升:{image:{zh:"地中生木，升之象——柔以时升，积小以高大；南征吉，志行也。",en:"Trees from the earth — pushing upward; grow small to tall, by steps; south brings good."},lines:["初六：允升，大吉。","九二：孚乃利用禴，无咎。","九三：升虚邑。","六四：王用亨于岐山，吉无咎。","六五：贞吉，升阶。","上六：冥升，利于不息之贞。"],lineImage:[{zh:"被信允而上升，大吉。",en:"Trusted, you rise — great good."},{zh:"心怀诚信，薄祭亦可受益，无咎。",en:"Sincere, a thin offering suffices — no blame."},{zh:"升入空虚的城邑——如入无人之境，畅通无阻。",en:"Rising into the empty town — unobstructed."},{zh:"君王祭享于岐山（因顺而升），吉祥无咎。",en:"The king sacrifices on Mount Qi — good, no blame."},{zh:"守正吉祥，沿阶而升（不骤进，按步升迁）。",en:"Correct and good — climbing the stairs step by step."},{zh:"昏暗中仍上升——知进而不知退，唯持续守正可保。",en:"Rising in the dark — keep correcting without cease."}]},泽水困:{image:{zh:"泽无水，困之象——水在泽下，身处困境；有言不信，尚口乃穷。",en:"The lake drained dry — oppression; words are not believed; silence and endurance serve."},lines:["初六：臀困于株木，入于幽谷，三岁不觌。","九二：困于酒食，朱绂方来，利用亨祀，征凶，无咎。","六三：困于石，据于蒺藜，入于其宫，不见其妻，凶。","九四：来徐徐，困于金车，吝，有终。","九五：劓刖，困于赤绂，乃徐有说，利用祭祀。","上六：困于葛藟，于臲卼，曰动悔。有悔，征吉。"],lineImage:[{zh:"臀部困于残株，进入幽谷，三年不见天日。",en:"Bottom on a stump, in a dark valley — three years unseen."},{zh:"被酒食所困（富贵而志不得伸），朱绂将至；宜祭享，急进则凶。",en:"Trapped in feasts — red sashes arrive; sacrifice, don t rush; no blame."},{zh:"困于巨石，据于蒺藜；回到家也看不见妻子——凶险。",en:"Rocks ahead, thorns behind, no wife at home — misfortune."},{zh:"徐徐而来，困于金车，有憾而终有好结果。",en:"Slow in coming, blocked by the bronze cart — regret, but an end."},{zh:"鼻遭割、足遭刖，被赤绂所困——渐渐得以舒展；宜于祭祀祈福。",en:"Nose cut, feet cut, trapped in red sashes — easing slowly; sacrifice."},{zh:"困于葛藤，危而不安；动则悔，有悔而速离困境则吉。",en:"Tangled in vines, swaying — move with regret; regret and go, it ends good."}]},水风井:{image:{zh:"木上有水，井之象——井养而不穷；打到水将出而瓶绳断了，功亏一篑。",en:"Water over wood — the well; the town may move, the well stays; water nearly up, the jug-rope breaks."},lines:["初六：井泥不食，旧井无禽。","九二：井谷射鲋，瓮敝漏。","九三：井渫不食，为我心恻，可用汲，王明，并受其福。","六四：井甃，无咎。","九五：井冽，寒泉食。","上六：井收勿幕，有孚元吉。"],lineImage:[{zh:"井底淤泥，水不可食；旧井连鸟雀都不来（被彻底废弃）。",en:"Mud in the well, undrinkable; no bird visits the old well."},{zh:"井底只够射小鱼，瓦罐又破又漏——才不得用。",en:"Shooting minnows in the well shaft, the pot cracked and leaking."},{zh:"井已淘清却无人饮用，令人心恻；若君王明察，上下同受其福。",en:"The well cleaned yet unused — heartbreaking; a wise king draws and all share the blessing."},{zh:"砌好井壁（修井之功），无咎。",en:"The well walled — no blame."},{zh:"井水清冽，寒泉可食——众所共仰。",en:"Cold, clear spring water — drinkable at last."},{zh:"井口收拢而不加盖——诚信元吉，泽及众人。",en:"The well finished, left uncovered — open to all, supreme good."}]},泽火革:{image:{zh:"泽中有火，革之象——水火相息，变革之时；己日乃孚，顺天应人。",en:"Fire in the lake — revolution; water and fire change each other; the new earns trust in time."},lines:["初九：巩用黄牛之革。","六二：己日乃革之，征吉，无咎。","九三：征凶，贞厉，革言三就，有孚。","九四：悔亡，有孚改命，吉。","九五：大人虎变，未占有孚。","上六：君子豹变，小人革面，征凶，居贞吉。"],lineImage:[{zh:"用黄牛皮绳牢牢巩固——变革之初，未可妄动。",en:"Bound fast with yellow oxhide — too early to change."},{zh:"到了己日（时机成熟）再行变革，前往吉祥，无咎。",en:"Change on the day itself — go, good, no blame."},{zh:"急进则凶，守正防危；变革之论三次讨论达成一致，才有诚信。",en:"Advance brings harm; thrice discussed, the reform wins trust."},{zh:"悔恨消亡，心存诚信而更改天命，吉祥。",en:"Regret gone — change the mandate with trust; good."},{zh:"大人变革如虎之斑纹，炳然昭著——不必占问，自有诚信。",en:"The great change like the tiger s stripes — trust without divining."},{zh:"君子变革如豹之斑纹，小人只革其面；急进则凶，安居守正则吉。",en:"The noble changes like the leopard, the petty only their faces; stay put, hold firm."}]},火风鼎:{image:{zh:"木上有火，鼎之象——鼎烹饪以养圣贤，稳重图新；元吉亨，国之重器。",en:"Fire over wood — the cauldron; cooking to nourish the wise, the state s heavy vessel."},lines:["初六：鼎颠趾，利出否，得妾以其子，无咎。","九二：鼎有实，我仇有疾，不我能即，吉。","九三：鼎耳革，其行塞，雉膏不食，方雨亏悔，终吉。","九四：鼎折足，覆公餗，其形渥，凶。","六五：鼎黄耳金铉，利贞。","上九：鼎玉铉，大吉，无不利。"],lineImage:[{zh:"鼎颠倒其趾（倒鼎倒出秽物），利于出清否秽；得妾因其子，无咎。",en:"The cauldron tips — pouring out the old; taking a maid for her child, no blame."},{zh:"鼎中盛满食物，我的仇家有疾，不能来犯我，吉祥。",en:"The cauldron full; my rival is ill and cannot reach me — good."},{zh:"鼎耳变异，鼎杠被塞，雉膏美而无人食；待阴阳和雨则亏悔而终吉。",en:"The ears changed, the bar blocked, the pheasant grease uneaten; after rain, regret ends well."},{zh:"鼎足折断，打翻了公侯的美食，汤汁淋漓——才弱任重，凶。",en:"The legs snap, the lord s stew spills — weak shoulders, heavy load; misfortune."},{zh:"鼎配黄色鼎耳、金属鼎杠（刚柔相济），守正有利。",en:"Yellow ears, bronze bar — correct and fitting."},{zh:"鼎配玉质鼎杠（刚而能润），大吉，无所不利。",en:"The jade bar — great good, nothing unfavorable."}]},震为雷:{image:{zh:"洊雷震，震之象——惊雷滚滚，临危不乱；震来虩虩，恐惧修省而亨通。",en:"Thunder doubled — the shock; fear that tightens the heart, then laughter; the ladle unspilled."},lines:["初九：震来虩虩，后笑言哑哑，吉。","六二：震来厉，亿丧贝，跻于九陵，勿逐，七日得。","六三：震苏苏，震行无眚。","九四：震遂泥。","六五：震往来厉，亿无丧，有事。","上六：震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。"],lineImage:[{zh:"惊雷袭来战兢兢，随后笑语声声——恐惧而后安，吉祥。",en:"Thunder brings dread, then laughter — good."},{zh:"惊雷骤至危险，遗失大量贝货；登上九陵之高，不必追寻，七日可得。",en:"Thunder, loss of treasure; climb the hill, don t chase — seven days, it s back."},{zh:"雷声使之苏醒不安，因惧而慎行，则无眚。",en:"Thunder jolts you awake — move with care, no harm."},{zh:"惊雷陷入泥沼——阳刚失位，欲动不能。",en:"Thunder sinks in the mud — stuck."},{zh:"雷声往来皆危——虽有亿般惊惧而无所失，因有事而慎守。",en:"Thunder rolls both ways — fear, but nothing lost."},{zh:"雷声令人瑟缩惶顾，前往凶险；灾未至其身而先至其邻，及早警惕则无咎。",en:"Trembling, darting eyes — advance brings harm; the quake hits the neighbor first."}]},艮为山:{image:{zh:"兼山艮，艮之象——两山并立，止之义；行止有度，动静不失其时。",en:"Twin mountains — keeping still; act and rest in season."},lines:["初六：艮其趾，无咎，利永贞。","六二：艮其腓，不拯其随，其心不快。","九三：艮其限，列其夤，厉薰心。","六四：艮其身，无咎。","六五：艮其辅，言有序，悔亡。","上九：敦艮，吉。"],lineImage:[{zh:"止住脚趾——在最初就停止，无咎，利永贞。",en:"Still the toes — stop at the start; no blame, hold firm forever."},{zh:"止住小腿——不能抬腿跟随，心中不快。",en:"Still the calves — the follower held, the heart uneasy."},{zh:"止其腰胯，撕裂了脊肉——危厉如火烧心。",en:"Still at the waist, the spine split — burning danger."},{zh:"止住全身，无咎。",en:"Still the body — no blame."},{zh:"止住牙床——言语有序，悔恨消亡。",en:"Still the jaw — ordered speech, regret gone."},{zh:"敦厚笃实地止——止于至善，吉祥。",en:"Deep stillness — good."}]},风山渐:{image:{zh:"山上有木，渐之象——木长于山，循序渐进；鸿雁南飞，依序而进。",en:"Trees on the mountain — development; the wild goose flies shore to shore, step by step."},lines:["初六：鸿渐于干，小子厉，有言，无咎。","六二：鸿渐于磐，饮食衎衎，吉。","九三：鸿渐于陆，夫征不复，妇孕不育，凶；利御寇。","六四：鸿渐于木，或得其桷，无咎。","九五：鸿渐于陵，妇三岁不孕，终莫之胜，吉。","上九：鸿渐于陆，其羽可用为仪，吉。"],lineImage:[{zh:"鸿雁飞临水涯——小子有危、有言语责难，无咎。",en:"The goose reaches the shore — the lad at risk, some talk; no blame."},{zh:"鸿雁飞临磐石之上——安稳饮食和乐，吉祥。",en:"The goose on the rock — eating and drinking at ease; good."},{zh:"鸿雁飞临高地——夫征不归，妇孕不育，凶；宜于抵御寇盗。",en:"The goose on the plateau — the husband gone, the child unborn; guard against robbers."},{zh:"鸿雁飞临树木——或得平直之枝可栖，无咎。",en:"The goose on the tree — finds the flat branch; no blame."},{zh:"鸿雁飞临山陵——妇三年不孕，终无人能胜，吉祥。",en:"The goose on the hill — three years barren, yet none can overcome; good."},{zh:"鸿雁飞临陆地，其羽毛可用作仪饰——吉祥。",en:"The goose soars over the land — feathers fit for ceremony; good."}]},雷泽归妹:{image:{zh:"泽上有雷，归妹之象——少女配长男，情动而不当位；征凶，知敝守常。",en:"Thunder over the lake — the marrying maiden; joy without proper place; advance brings harm."},lines:["初九：归妹以娣，跛能履，征吉。","九二：眇能视，利幽人之贞。","六三：归妹以须，反归以娣。","九四：归妹愆期，迟归有时。","六五：帝乙归妹，其君之袂，不如其娣之袂良，月几望，吉。","上六：女承筐无实，士刲羊无血，无攸利。"],lineImage:[{zh:"妹妹作为陪嫁（娣），如跛足仍能行走，前往吉祥。",en:"The younger sister as concubine-wife — the lame can still walk; good."},{zh:"独眼而能视，利于幽静守正之人。",en:"The one-eyed can see — good for the quiet and correct."},{zh:"想以正室身份出嫁，反退回做陪嫁。",en:"Aspiring to be queen, returned to be handmaid."},{zh:"嫁期延误——迟归以待时机（宁迟勿苟）。",en:"The wedding delayed — better late than wrong."},{zh:"帝乙嫁妹——正室的服饰反不如陪嫁华美；月近圆而未满，吉祥。",en:"The king s daughter weds down, her sleeves plainer than the maid s; near-full moon, good."},{zh:"女子捧筐无物，男子割羊无血——徒具仪式，无所得利。",en:"The basket empty, the sheep bloodless — form without substance."}]},雷火丰:{image:{zh:"雷电皆至，丰之象——盛大丰腴，如日中午天；宜照天下，勿忧宜日中。",en:"Thunder and lightning together — abundance; the sun at noon lights all."},lines:["初九：遇其配主，虽旬无咎，往有尚。","六二：丰其蔀，日中见斗，往得疑疾，有孚发若，吉。","九三：丰其沛，日中见沫，折其右肱，无咎。","九四：丰其蔀，日中见斗，遇其夷主，吉。","六五：来章，有庆誉，吉。","上六：丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。"],lineImage:[{zh:"遇见匹配的主人——虽旬相配，无咎，前往有嘉尚。",en:"Meet the matching host — well met; go with honor."},{zh:"丰大其遮蔽，正午见北斗——前往会得疑疾；以诚信感发，吉祥。",en:"The screen so thick you see the Dipper at noon — suspicion; sincerity breaks through; good."},{zh:"丰大其幡幔，正午见小星——折断了右臂，无咎（折肱自守）。",en:"The curtain thicker still, stars at noon — the right arm broken; no blame."},{zh:"丰大其遮蔽，正午见北斗——遇见匹配的主人，吉祥。",en:"The screen, the Dipper at noon — meet the host of your kind; good."},{zh:"招来章美，有喜庆与赞誉，吉祥。",en:"The brilliant comes — celebration and praise; good."},{zh:"丰大其屋，遮蔽其家——窥其门户，寂静无人，三年不见，凶。",en:"The grand house, screened and shut — peep in: silence, three years empty; misfortune."}]},火山旅:{image:{zh:"山上有火，旅之象——火行山上不留处，羁旅在外；柔顺利贞，明慎用刑。",en:"Fire on the mountain — the wanderer; fire moves and does not stay; be gentle and careful."},lines:["初六：旅琐琐，斯其所取灾。","六二：旅即次，怀其资，得童仆贞。","九三：旅焚其次，丧其童仆，贞厉。","九四：旅于处，得其资斧，我心不快。","六五：射雉一矢亡，终以誉命。","上九：鸟焚其巢，旅人先笑后号咷。丧牛于易，凶。"],lineImage:[{zh:"旅途琐屑卑贱，这是自取其灾。",en:"Trivial fussing on the road — you invite your own trouble."},{zh:"旅途中住进客舍，携带资财，得到忠心的童仆，守正。",en:"An inn, your goods, a faithful servant — settled."},{zh:"客舍失火，童仆也跑了——守正防危。",en:"The inn burns, the servant flees — hold firm against harm."},{zh:"旅途中暂得栖身之处，获得资斧，但心中不快。",en:"A place to stay, axe and goods — yet the heart is heavy."},{zh:"射野鸡，一矢而中——虽有亡矢之费，终获美誉与爵命。",en:"One arrow, one pheasant — cost a shaft, gain fame and title."},{zh:"鸟巢被焚——旅人先笑后号咷；在田畔丧失了牛，凶。",en:"The nest burns — first laughter, then wailing; the ox lost at the border; misfortune."}]},巽为风:{image:{zh:"随风巽，巽之象——风随风至，谦逊申命；柔皆顺乎刚，渗透无孔不入。",en:"Wind upon wind — the gentle; the command repeated, seeping everywhere, yielding to strength."},lines:["初六：进退，利武人之贞。","九二：巽在床下，用史巫纷若，吉无咎。","九三：频巽，吝。","六四：悔亡，田获三品。","九五：贞吉悔亡，无不利。无初有终，先庚三日，后庚三日，吉。","上九：巽在床下，丧其资斧，贞凶。"],lineImage:[{zh:"进退不决——利于以武人之勇来匡正（以刚济柔）。",en:"Hesitant advance and retreat — the soldier s firmness corrects it."},{zh:"屈尊伏于床下，如史官巫者纷以祝祷——吉祥无咎。",en:"Beneath the bed, praying like the shaman — good, no blame."},{zh:"频频卑顺——屈从过度，有憾。",en:"Bowing again and again — regret."},{zh:"田猎获得三品（祭祀、宾客、充庖之获），悔恨消亡。",en:"The hunt takes three grades of game — regret gone."},{zh:"守正吉祥悔恨消亡，无所不利；无初有终——先庚三日、后庚三日（丁宁于申命），吉祥。",en:"Correct, regret gone, all well; no start but an end — command thrice before and after; good."},{zh:"伏于床下，丧失了资财与斧斤——卑顺失正，凶险。",en:"Under the bed, losing axe and goods — misfortune."}]},兑为泽:{image:{zh:"丽泽兑，兑之象——两泽相连，互相滋益；说以先民，和悦而守正。",en:"Lakes joined — the joyous; waters enrich each other; joy that leads and stays correct."},lines:["初九：和兑，吉。","九二：孚兑，吉，悔亡。","六三：来兑，凶。","九四：商兑，未宁，介疾有喜。","九五：孚于剥，有厉。","上六：引兑。"],lineImage:[{zh:"和悦待人，吉祥。",en:"Harmonious joy — good."},{zh:"以诚信相悦，吉祥，悔恨消亡。",en:"Joy in trust — good, regret gone."},{zh:"前来谄媚求悦——非道而来，凶。",en:"Coming to flatter — misfortune."},{zh:"商度择选所悦，心尚未定；隔断谄佞之疾，则有喜。",en:"Weighing whom to delight — undecided; shut out flattery and rejoice."},{zh:"诚信施于剥蚀小人，有危险。",en:"Trusting the depleting — danger."},{zh:"引诱他人来悦己——非正，其光未显。",en:"Luring others  delight — not upright, no light."}]},风水涣:{image:{zh:"风行水上，涣之象——冰散瓦解之散，亦可济川之散；涣极转聚，挽涣散为合力。",en:"Wind over water — dispersion; ice breaks up, yet the flood can be crossed."},lines:["初六：用拯马壮，吉。","九二：涣奔其机，悔亡。","六三：涣其躬，无悔。","六四：涣其群，元吉。涣有丘，匪夷所思。","九五：涣汗其大号，涣王居，无咎。","上九：涣其血，去逖出，无咎。"],lineImage:[{zh:"借助壮马拯救涣散（如拯马之奔），吉祥。",en:"Save it with a strong horse — good."},{zh:"涣散之时奔就几案（凭依而安），悔恨消亡。",en:"Fleeing the flood to the bench — regret gone."},{zh:"涣散自身（忘身以济涣），无悔。",en:"Scatter the self — no regret."},{zh:"涣散其朋党，元吉；涣有丘聚——散小群而成大聚，匪夷所思。",en:"Scatter the cliques — supreme good; a hill gathers, beyond all thought."},{zh:"如汗水发散不可收回，发布重大号令；散其积聚以济天下，无咎。",en:"Sweat sweeps the body — issue the great command; the king gives freely, no blame."},{zh:"涣其血而远去——脱离伤害，无咎。",en:"The blood dispersed, far away — out of harm, no blame."}]},水泽节:{image:{zh:"泽上有水，节之象——筑堤节水，制度数、议德行；节而亨，苦节则不可守。",en:"Water over the lake — limitation; the dike sets the measure; bitter limits break."},lines:["初九：不出户庭，无咎。","九二：不出门庭，凶。","六三：不节若，则嗟若，无咎。","六四：安节，亨。","九五：甘节，吉，往有尚。","上六：苦节，贞凶，悔亡。"],lineImage:[{zh:"不出户庭（知通则塞），无咎。",en:"Not leaving the inner court — no blame."},{zh:"不出门庭——该出而不出，坐失时机，凶。",en:"Not leaving the outer court — missing the moment; misfortune."},{zh:"不节制则嗟叹——知嗟而悔，无咎。",en:"No limit, then lament — lament teaches; no blame."},{zh:"安于节制，亨通。",en:"At ease with limits — success."},{zh:"以节制为甘美，吉祥，前往有嘉尚。",en:"Sweet limits — good; go with honor."},{zh:"苦节——节制到痛苦的程度，守正亦凶；若能知悔，则悔亡。",en:"Bitter limits — harm even when correct; repent and it fades."}]},风泽中孚:{image:{zh:"泽上有风，中孚之象——两阳夹虚，中空虚怀，诚信及于豚鱼；孚乃化邦。",en:"Wind over the lake — inner truth; an open heart; trust reaching even to pigs and fish."},lines:["初九：虞吉，有它不燕。","九二：鸣鹤在阴，其子和之，我有好爵，吾与尔靡之。","六三：得敌，或鼓或罢，或泣或歌。","六四：月几望，马匹亡，无咎。","九五：有孚挛如，无咎。","上九：翰音登于天，贞凶。"],lineImage:[{zh:"安守诚信则吉；另有他图则不安。",en:"Trust and rest — good; chase other things, no peace."},{zh:"鹤鸣于树阴，其子相和；我有美酒，与你共享——至诚相感。",en:"The crane calls in the shade, its young answer; I have good wine to share with you."},{zh:"遇到匹敌，或鼓或息，或泣或歌——无恒定之信，随感而变。",en:"Meeting the match — drum or rest, weep or sing, blown by the wind."},{zh:"月近圆，马匹亡失——绝类上从（舍其同类而从五），无咎。",en:"The moon near full, the horse gone — leaving its kind to follow the fifth; no blame."},{zh:"以诚信牵系上下，无咎。",en:"Trust binding all together — no blame."},{zh:"鸡鸣之声登于天——虚声远闻而实德不副，守正亦凶。",en:"The cock s crow rises to heaven — sound without substance; misfortune."}]},雷山小过:{image:{zh:"山上有雷，小过之象——飞鸟遗音，可小事不可大事；宜下不宜上，稍有逾越。",en:"Thunder on the mountain — small exceeding; the bird s call trails off; bow down, don t soar."},lines:["初六：飞鸟以凶。","六二：过其祖，遇其妣；不及其君，遇其臣；无咎。","九三：弗过防之，从或戕之，凶。","九四：无咎，弗过遇之。往厉必戒，勿用永贞。","六五：密云不雨，自我西郊，公弋取彼在穴。","上六：弗遇过之，飞鸟离之，凶，是谓灾眚。"],lineImage:[{zh:"飞鸟逆势而高飞——凶（不知宜下）。",en:"The bird flies high — misfortune."},{zh:"越过祖父，遇到祖母；不及其君，遇到其臣——分有当否，无咎。",en:"Pass the grandfather, meet the grandmother; miss the lord, meet his minister — no blame."},{zh:"不加防备则或遭戕害——小过不防，凶。",en:"Fail to guard, and you may be struck — misfortune."},{zh:"守正则无咎；不过分而随遇之，前往有危必警戒——勿用久持其位。",en:"No blame; meet without exceeding; go with care — don t cling to the post."},{zh:"密云不雨，云自我西郊；公弋射鸟于穴中——宜守不宜进。",en:"Dense clouds, no rain from the west; the lord shoots birds in their cave — stay, don t push."},{zh:"不相遇而越过去——飞鸟陷入罗网，凶，这叫灾眚。",en:"Missing the mark and passing beyond — the bird caught in the net; calamity."}]},水火既济:{image:{zh:"水在火上，既济之象——阴阳各得其位，事已成功；初吉终乱，守成最难。",en:"Water over fire — after completion; every line in its place; order frays at the end."},lines:["初九：曳其轮，濡其尾，无咎。","六二：妇丧其茀，勿逐，七日得。","九三：高宗伐鬼方，三年克之，小人勿用。","六四：繻有衣袽，终日戒。","九五：东邻杀牛，不如西邻之禴祭，实受其福。","上六：濡其首，厉。"],lineImage:[{zh:"拖住车轮，沾湿尾巴——谨慎守成，无咎。",en:"Drag the wheel, wet the tail — caution after success; no blame."},{zh:"妇人丢失车蔽，勿追寻，七日可得。",en:"The wife loses her screen — don t chase; seven days, it s back."},{zh:"高宗征伐鬼方，三年攻克——大功须久，小人不可任。",en:"Gaozong s long campaign against the demons — three years; use no petty men."},{zh:"船有漏洞，备好破衣堵塞——终日戒备，防患未然。",en:"Leak in the boat, rags at hand — all-day vigilance."},{zh:"东邻杀牛（厚祭）不如西邻之薄祭——实受其福（在德不在物）。",en:"The east neighbor s ox less blessed than the west s thin offering — substance over show."},{zh:"沾湿了头——既济之极，乐极生危。",en:"The head wets — at the peak, joy tips into danger."}]},火水未济:{image:{zh:"火在水上，未济之象——事未竟成，小狐渡河沾湿尾巴；慎辨物居方，未来可期。",en:"Fire over water — before completion; the fox wades the river, tail soaked; the end is not yet written."},lines:["初六：濡其尾，吝。","九二：曳其轮，贞吉。","六三：未济，征凶，利涉大川。","九四：贞吉，悔亡，震用伐鬼方，三年有赏于大国。","六五：贞吉，无悔，君子之光，有孚，吉。","上九：有孚于饮酒，无咎，濡其首，有孚失是。"],lineImage:[{zh:"小狐沾湿尾巴——不知量力而行，有憾。",en:"Wet tail — misjudge
